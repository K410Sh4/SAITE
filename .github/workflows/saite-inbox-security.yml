name: SAITE Inbox Security Checks
on:
  push:
    paths:
      - 'inbox-worker/**'
      - '.github/workflows/saite-inbox-security.yml'
  pull_request:
    paths:
      - 'inbox-worker/**'
      - '.github/workflows/saite-inbox-security.yml'
permissions:
  contents: read
jobs:
  verify-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        working-directory: inbox-worker
        run: npm run check
      - name: Security smoke tests
        working-directory: inbox-worker
        run: npm test
